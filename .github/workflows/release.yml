name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - run: pnpm -r run test
      - name: check npm token
        id: npm
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not configured — skipping npm publish. Packages are still attached to the GitHub release as installable tarballs."
          fi
      - name: publish @proofix/cli and @proofix/dsh-plugin
        if: steps.npm.outputs.available == 'true'
        run: |
          pnpm --filter @proofix/cli publish --access public --no-git-checks --provenance
          pnpm --filter @proofix/dsh-plugin publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: build release tarballs
        run: |
          pnpm --filter @proofix/cli pack --pack-destination artifacts
          pnpm --filter @proofix/dsh-plugin pack --pack-destination artifacts
          ls -la artifacts
      - name: create GitHub release
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.tgz --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
